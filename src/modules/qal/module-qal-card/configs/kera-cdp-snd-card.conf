[Global]
default-profile = default

[Port speaker]
description = speaker
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 200
presence = always
device = PAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port native-hdmi-out]
description = native-hdmi-out
direction = out
priority = 350
presence = dynamic
device = PAL_DEVICE_OUT_HDMI
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right
hdmi-tx-state = /sys/devices/platform/soc/soc:qcom,msm-ext-disp/extcon/extcon1/cable.1/state
format-detection = yes

[Port usb-out]
description = usb-out
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 400
presence = dynamic
device = PAL_DEVICE_OUT_USB_HEADSET
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port headset]
description = headset
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 100
presence = always
device = PAL_DEVICE_OUT_WIRED_HEADSET
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port handset-mic]
description = builtin mic
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = PAL_DEVICE_IN_HANDSET_MIC

[Port usb-in]
description = usb-in
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 100
presence = dynamic
device = PAL_DEVICE_IN_USB_HEADSET

[Port speaker-mic]
description = builtin mic
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = PAL_DEVICE_IN_SPEAKER_MIC

[Port bta2dp-in]
description = BT a2dp source port
default-channel-map = front-left,front-right
default-sample-rate = 44100
direction = in
priority = 50
presence = dynamic
device = PAL_DEVICE_IN_BLUETOOTH_A2DP

[Port headset-mic]
description = headset input
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = PAL_DEVICE_IN_WIRED_HEADSET

[Port bta2dp-out]
description = BT a2dp source port
default-channel-map = front-left,front-right
default-sample-rate = 44100
direction = out
priority = 50
presence = dynamic
device = PAL_DEVICE_OUT_BLUETOOTH_A2DP

[Port btsco-out]
description = BT SCO sink port
default-channel-map = front-left
default-sample-rate = 16000
direction = out
priority = 50
presence = dynamic
device = PAL_DEVICE_OUT_BLUETOOTH_SCO

[Port btsco-in]
description = BT SCO source port
default-channel-map = front-left
default-sample-rate = 16000
direction = in
priority = 50
presence = dynamic
device = PAL_DEVICE_IN_BLUETOOTH_SCO_HEADSET

[Profile default]
description = Default pal profile
priority = 500
max-sink-channels = 2
max-source-channels = 2
port-names = speaker headset handset-mic native-hdmi-out usb-out usb-in bta2dp-out btsco-in btsco-out headset-mic

[Sink low-latency0]
description = pal sink to play via low-latency path
type = PAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker headset native-hdmi-out usb-out
presence = always
use-hw-volume = true

[Sink offload0]
description = pal sink to play compressed via offload path
type = PAL_STREAM_COMPRESSED
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = mpeg aac
default-buffer-size = 16484
default-buffer-count = 4
port-names = speaker headset native-hdmi-out usb-out
presence = always
use-hw-volume = true

[Sink offload1]
description = pal sink to play via pcm-offload path
type = PAL_STREAM_PCM_OFFLOAD
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker headset native-hdmi-out usb-out
presence = always
use-hw-volume = true

[Sink voip-rx0]
description = pal sink to play via voip rx path
type = PAL_STREAM_VOIP_RX
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker headset btsco-out
presence = always
use-hw-volume = true

[Source regular0]
description = pal source to capture pcm via regular record path
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic usb-in headset-mic
presence = always

[Source voip-tx0]
description = pal source to capture pcm via voip tx record path
type = PAL_STREAM_VOIP_TX
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-center
default-buffer-size = 1920
default-buffer-count = 2
port-names = speaker-mic handset-mic btsco-in headset-mic
presence = always

[Sink bta2dp-rx0]
description = pal sink to play audio on remote BT device
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
encodings = pcm
port-names = bta2dp-out
presence = dynamic
use-hw-volume = true

[Sink btsco-rx0]
description = pal sink for hfp-ag rx
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 16000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
encodings = pcm
port-names = btsco-out
presence = dynamic
use-hw-volume = true

[Source btsco-tx0]
description = pal source for hfp-ag tx
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 16000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
encodings = pcm
port-names = btsco-in
presence = dynamic

[Loopback bta2dp]
description = pal loopback module for btsink usecase
in-port-names = bta2dp-in
out-port-names = speaker

[Loopback hfp_tx]
description = pal loopback module for hfp TX path
in-port-names = speaker-mic
out-port-names = btsco-out

[Loopback hfp_rx]
description = pal loopback module for hfp RX path
in-port-names = btsco-in
out-port-names = speaker
