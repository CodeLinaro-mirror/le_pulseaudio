[Global]
default-profile = default

[Port speaker]
description = speaker
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 200
presence = always
device = PAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port hdmi-out]
description = hdmi-out
direction = out
priority = 300
presence = dynamic
device = PAL_DEVICE_OUT_AUX_DIGITAL
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right
hdmi-tx-state = /sys/devices/platform/soc/soc:qcom,msm-ext-disp/extcon/extcon1/cable.0/state
format-detection = yes

[Port handset-mic]
description = builtin mic
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = PAL_DEVICE_IN_HANDSET_MIC

[Profile default]
description = Default pal profile
priority = 500
max-sink-channels = 2
max-source-channels = 2
port-names = speaker handset-mic hdmi-out

[Sink low-latency0]
description = pal sink to play via low-latency path
type = PAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker hdmi-out
presence = always
use-hw-volume = true

[Sink offload0]
description = pal sink to play compressed via offload path
type = PAL_STREAM_COMPRESSED
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = mpeg aac
default-buffer-size = 16484
default-buffer-count = 4
port-names = speaker hdmi-out
presence = always
use-hw-volume = true

[Source regular0]
description = pal source to capture pcm via regular record path
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always
