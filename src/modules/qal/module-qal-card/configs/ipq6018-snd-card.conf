[Global]
default-profile = default

[Port speaker]
description = speaker
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 200
presence = always
device = QAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port speaker-mic]
description = speaker mic
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = in
priority = 100
presence = always
device = QAL_DEVICE_IN_SPEAKER_MIC

[Port builtin-mic]
description = builtin mic
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = QAL_DEVICE_IN_HANDSET_MIC

[Port tri-mic]
description = tri mic
default-channel-map = front-left,front-right,front-center
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = QAL_DEVICE_IN_TRI_MIC

[Port quad-mic]
description = quad mic
default-channel-map = front-left,front-right,rear-left,rear-right
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = QAL_DEVICE_IN_QUAD_MIC

[Profile default]
description = Default qal profile
priority = 500
max-sink-channels = 12
max-source-channels = 2
port-names = speaker speaker-mic builtin-mic tri-mic quad-mic

[Sink low-latency0]
description = qal sink to play via low-latency path
type = QAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker
presence = always
use-hw-volume = true

[Source low-latency0]
description = qal source to capture pcm via regular record path
type = QAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 3840
default-buffer-count = 2
port-names = speaker-mic
presence = always
