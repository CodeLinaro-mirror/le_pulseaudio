; Default config definitions for qal  module

;[Global]
; default-profile =                                  #name of the profile

; [Port name]
; description = ...
; direction = in | out
; priority = ...
; presence = static | dynamic | always                                     #static means port is always available but device
                                                                           #connection is not known.
                                                                           #dynamic mean port presence is detected at dynamically.
                                                                           #always means port and device both are always present.
; device = qal device

; [Profile name]
; description = ...
; priority = ...
; max-sink-channels =
; max-source-channels =
; port-names =                                                             #list of port names in this profile
                                                                           #for port effect,list of port for which its supported

;[Sink name]
; name =
; description =
; type = offload | low-latency | ultra-low-latency
; default-sample-format =                                                  #default sample format
; default-sample-rate =                                                    #default sample rate
; default-channel-map =                                                    #default channel map
; encodings =                                                              #list of encodings
; sample-rates =                                                           #list of supported sample rates
; sample-formats =                                                         #list of sample formats
; channel-maps =                                                           #list of channel maps
; presence = static | dynamic                                              #static sinks are created at module load and dynamic sink are created based on event
; port-names =                                                             #list of support ports for this sink, first entry is will be considered as default port
; use-hw-volume = true | false                                             #true for if dsp volume needs to applied
; alternate-sample-rate =                                                  #alternate sample to be supported

;[Source name]
; name =
; description =
; type = low-latecy or regular or iec61937
; default-sample-format =                                                  #default sample format
; default-sample-rate =                                                    #default sample rate
; default-channel-map =                                                    #default channel map
; encodings =                                                              #list of encodings
; sample-rates =                                                           #list of supported sample rates
; sample-formats =                                                         #list of sample formats
; channel-maps =                                                           #list of channel maps
; presence = static | dynamic                                              #static sinks are created at module load and dynamic sink are created based on event
; port-names =                                                             #list of support ports for this sink, first entry is will                                                                                                         #be considered as default port
; alternate-sample-rate =                                                  #alternate sample to be supported

[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 100
presence = static
device = QAL_DEVICE_OUT_SPEAKER

[Port lineout]
description = lineout
direction = out
priority = 200
presence = static
device = QAL_DEVICE_OUT_LINE

[Port builtin-mic]
description = builtin-mic
direction = in
priority = 100
presence = static
device = QAL_DEVICE_IN_HANDSET_MIC

[Profile default]
description = Default qal profile
priority = 500
max-sink-channels = 8
max-source-channels = 2
port-names = speaker lineout builtin-mic

[Sink low-latency]
description = qal sink to play via low-latency path
type = QAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = lineout
presence = always
use-hw-volume = true
alternate-sample-rate = 44100

[Source regular0]
description = qal source to capture pcm via regular record path
type = QAL_STREAM_RAW
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = builtin-mic
presence = always
