[Global]
default-profile = default
use-dolby-hw-loopback = no
no-primary-sink = yes

[Port bta2dp-out]
description = bt a2dp output
direction = out
priority = 300
presence = dynamic
device = AUDIO_DEVICE_OUT_BLUETOOTH_A2DP
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port btsco-in]
description = bt sco input
direction = in
priority = 100
presence = dynamic
device = AUDIO_DEVICE_IN_BLUETOOTH_SCO_HEADSET
encodings = pcm
sample-formats = s16le
sample-rates = 16000
channel-maps = front-left,front-right

[Port linein]
description = linein input
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_LINE
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right

[Port bta2dp-in]
description = bt a2dp input
direction = in
priority = 100
presence = dynamic
device = AUDIO_DEVICE_IN_BLUETOOTH_A2DP
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port spdif-in]
description = spdif input
direction = in
priority = 300
presence = static
device = AUDIO_DEVICE_IN_SPDIF
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes
state-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_state
sample-format-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_format
sample-rate-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_rate
audio-preemph-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_preemph

[Port hdmi-arc]
description = hdmi-arc
direction = in
priority = 50
presence = dynamic
device = AUDIO_DEVICE_IN_HDMI_ARC
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes
port-type = secondary
primary-port-name = hdmi-in
linkon0-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/link_on0
poweron-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/power_on
audio-path-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_path
arc-enable-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/arc_enable
earc-enable-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/earc_enable
state-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_state
sample-format-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_format
sample-rate-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_rate
sample-layout-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_layout
sample-channel-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_ch_count
arc-state-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-sec-tx/audio_state
arc-sample-format-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-sec-tx/audio_format
arc-sample-rate-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-sec-tx/audio_rate
audio-preemph-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_preemph
arc-audio-preemph-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-sec-tx/audio_preemph

[Port hdmi-in]
description = hdmi-in
direction = in
priority = 50
presence = dynamic
device = AUDIO_DEVICE_IN_HDMI
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes
port-type = primary
linked-ports = hdmi-arc
linkon0-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/link_on0
poweron-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/power_on
audio-path-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_path
arc-enable-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/arc_enable
earc-enable-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/earc_enable
state-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_state
sample-format-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_format
sample-rate-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_rate
sample-layout-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_layout
sample-channel-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_ch_count
sample-ch-alloc-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_ch_alloc
audio-preemph-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_preemph
dsd-rate-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/dsd_rate

[Port builtin-mic]
description = builtin mic
direction = in
priority = 100
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Port builtin-mic-ec-ref-loopback]
description = builtin mic and ec ref loopback
direction = in
priority = 10
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC_AND_EC_REF_LOOPBACK

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 12
max-source-channels = 14
port-names = linein builtin-mic spdif-in bta2dp-in hdmi-in hdmi-arc builtin-mic-ec-ref-loopback btsco-in bta2dp-out

[Sink offload-bta2dp]
description = qahw sink to play pcm/compressed data on bta2dp port via offload path
type = offload
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm mpeg aac
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT AUDIO_OUTPUT_FLAG_FAST QAHW_OUTPUT_FLAG_TIMESTAMP
port-names = bta2dp-out
presence = dynamic
use-hw-volume = true
max-sink-gain = 0.4

[Source regular-builtin-mic]
description = qahw source to capture pcm with source builtin-mic via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = builtin-mic builtin-mic-ec-ref-loopback
avoid-processing = true
presence = always
source-type = AUDIO_SOURCE_MIC
use-qahw-processing = none
priority = 1

[Source regular-builtin-mic-ec-ref-loopback0]
description = qahw source to capture mic and ec reference pcm data via compress record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = builtin-mic-ec-ref-loopback
avoid-processing = true
presence = always
source-type = AUDIO_SOURCE_MIC
buffer-duration = 20

[Source regular-linein]
description = qahw source to capture pcm with source linein via regular record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS QAHW_INPUT_FLAG_TIMESTAMP
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = linein
presence = always
source-type = AUDIO_SOURCE_MIC

[Source regular-spdif-in]
description = qahw source to capture pcm with source spdif via regular record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS AUDIO_INPUT_FLAG_FAST QAHW_INPUT_FLAG_TIMESTAMP
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = spdif-in
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 5

[Source regular-hdmi-in]
description = qahw source to capture pcm with source hdmi in via regular record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS AUDIO_INPUT_FLAG_FAST QAHW_INPUT_FLAG_TIMESTAMP
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = hdmi-in
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 4

[Source dsd-hdmi-in]
description = qahw source to capture pcm with source hdmi in via DSD record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS QAHW_INPUT_FLAG_PASSTHROUGH
default-encoding = dsd
default-sample-rate = 44100
default-sample-format = s32le
default-channel-map = front-left,front-right
encodings = dsd
port-names = hdmi-in
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 20

[Source regular-hdmi-arc]
description = qahw source to capture pcm with source hdmi arc via regular record path
type = regular
flags = QAHW_INPUT_FLAG_COMPRESS AUDIO_INPUT_FLAG_FAST QAHW_INPUT_FLAG_TIMESTAMP
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = hdmi-arc
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 4

[Source iec61937-spdif-in]
description = qahw source to capture iec61937 with source spdif via passthrough capture path
type = passthrough
flags = QAHW_INPUT_FLAG_PASSTHROUGH QAHW_INPUT_FLAG_COMPRESS QAHW_INPUT_FLAG_TIMESTAMP AUDIO_INPUT_FLAG_FAST
default-encoding = unknown-iec61937
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = unknown-iec61937 unknown-4x-iec61937 unknown-hbr-iec61937
port-names = spdif-in
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 4

[Source regular-bta2dp]
description = qahw source to capture pcm with a2dp port via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = bta2dp-in
presence = dynamic
source-type = AUDIO_SOURCE_MIC

[Source regular-btsco]
description = qahw source to capture pcm with sco port via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 16000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = btsco-in
presence = dynamic
source-type = AUDIO_SOURCE_MIC

[Source iec61937-hdmi-in]
description = qahw source to capture iec61937 with source hdmi in via passthrough capture path
type = passthrough
flags = QAHW_INPUT_FLAG_PASSTHROUGH QAHW_INPUT_FLAG_COMPRESS QAHW_INPUT_FLAG_TIMESTAMP AUDIO_INPUT_FLAG_FAST
default-encoding = unknown-iec61937
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = unknown-iec61937 unknown-4x-iec61937 unknown-hbr-iec61937
port-names = hdmi-in
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 4

[Source iec61937-hdmi-arc]
description = qahw source to capture iec61937 with source hdmi arc via passthrough capture path
type = passthrough
flags = QAHW_INPUT_FLAG_PASSTHROUGH QAHW_INPUT_FLAG_COMPRESS QAHW_INPUT_FLAG_TIMESTAMP AUDIO_INPUT_FLAG_FAST
default-encoding = unknown-iec61937
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = unknown-iec61937 unknown-4x-iec61937 unknown-hbr-iec61937
port-names = hdmi-arc
presence = dynamic
source-type = AUDIO_SOURCE_UNPROCESSED
buffer-duration = 4

