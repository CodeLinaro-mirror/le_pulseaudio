[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 200
presence = always
device = AUDIO_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port lineout]
description = lineout
direction = out
priority = 100
presence = always
device = AUDIO_DEVICE_OUT_LINE
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port linein]
description = linein input
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_LINE
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right

[Port spdif-in]
description = spdif input
direction = in
priority = 300
presence = static
device = AUDIO_DEVICE_IN_SPDIF
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes

[Port builtin-mic]
description = builtin mic
direction = in
priority = 100
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 12
max-source-channels = 2
port-names = speaker lineout builtin-mic spdif-in

[Sink offload0]
description = qahw sink to play pcm via offload path
type = pcm-offload
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = lineout
presence = always
use-hw-volume = true
alternate-sample-rate = 44100

[Sink low-latency0]
description = qahw sink to play pcm via low-latency path
type = low-latency
flags = AUDIO_OUTPUT_FLAG_FAST
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = lineout
presence = always
use-hw-volume = false

[Sink ultra-low-latency0]
description = qahw sink to play pcm via ultra-low-latency path
type = ultra-low-latency
flags = AUDIO_OUTPUT_FLAG_RAW
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = lineout
presence = dynamic
use-hw-volume = false

[Source regular0]
description = qahw source to capture pcm via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = builtin-mic linein
presence = always

[Source regular1]
description = qahw source to capture pcm with source spdif via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = spdif-in
presence = dynamic

[Source iec61937]
description = qahw source to capture iec61937 with source spdif via passthrough capture path
type = passthrough
flags = QAHW_INPUT_FLAG_PASSTHROUGH QAHW_INPUT_FLAG_COMPRESS
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = unknown-iec61937 unknown-4x-iec61937 unknown-hbr-iec61937
port-names = spdif-in
presence = dynamic

[Loopback Loopback0]
description = qahw hw loopback module
in-port-names = linein spdif-in
out-port-names = lineout

[Effect bassboost]
description = bassboost effect
type = sink
endpoint-names = offload0

[Effect virtualizer]
description = virtualizer effect
type = sink
endpoint-names = offload0

[Effect equalizer]
description = equalizer effect
type = sink
endpoint-names = offload0

[Effect preset_reverb]
description = preset_reverb effect
type = sink
endpoint-names = offload0

[Effect audiosphere]
description = audiosphere effect
type = port
endpoint-names = speaker
