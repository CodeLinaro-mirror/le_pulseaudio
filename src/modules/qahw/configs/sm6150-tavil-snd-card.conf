[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 200
presence = always
device = AUDIO_DEVICE_OUT_SPEAKER

[Port headphone]
description = headphone output
direction = out
priority = 100
presence = static
device = AUDIO_DEVICE_OUT_WIRED_HEADSET

[Port headset-mic]
description = headset input
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_WIRED_HEADSET

[Port builtin-mic]
description = builtin mic
direction = in
priority = 200
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Port builtin-mic-speaker-mic2]
description = builtin mic and speaker mic2 record
direction = in
priority = 100
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC_AND_SPEAKER_MIC2_CAPTURE
encodings = pcm
sample-formats = s16le
sample-rates = 48000

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 8
max-source-channels = 2
port-names = speaker headphone builtin-mic headset-mic builtin-mic-speaker-mic2

[Sink offload0]
description = qahw sink to play pcm/compressed music data via offload path
type = offload
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm mpeg aac
port-names = speaker headphone
presence = always
use-hw-volume = true

[Sink primary]
description = qahw sink to play pcm non-music data via primary path
type = primary
flags = AUDIO_OUTPUT_FLAG_PRIMARY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = speaker headphone
presence = always
use-hw-volume = false

[Sink low-latency0]
description = qahw sink to play pcm via low-latency path
type = primary
flags = AUDIO_OUTPUT_FLAG_FAST
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
port-names = speaker headphone
presence = always
use-hw-volume = false

[Source regular0]
description = qahw source to capture pcm via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = builtin-mic headset-mic
avoid-processing = true
presence = always
source-type = AUDIO_SOURCE_MIC

[Source regular0-builtin-mic-speaker-mic2]
description = qahw source to capture pcm via builtin mics and speaker mic2
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
encodings = pcm
port-names = builtin-mic-speaker-mic2
avoid-processing = true
presence = always
source-type = AUDIO_SOURCE_MIC

[Source regular0_fluence]
description = qahw source to capture pcm via regular record path with fluence enabled
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 16000
default-sample-format = s16le
default-channel-map = mono
encodings = pcm
sample-rates = 8000 16000 32000 48000 ;Fluence supports only these rates
sample-formats = s16le ;Fluence is supported only for 16bit
channel-maps = mono ;Fluence is supported for mono channel only
use-qahw-processing = fluence
port-names = builtin-mic
presence = always
source-type = AUDIO_SOURCE_MIC

[Effect bassboost]
description = bassboost effect
lib-name = libqcompostprocbundle.so
uuid = 2c4a8c24-1581-487f-94f6-0002a5d5c51b
endpoint-names = offload0

[Effect virtualizer]
description = virtualizer effect
lib-name = libqcompostprocbundle.so
