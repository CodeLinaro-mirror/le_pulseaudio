; Default config definitions for qahw  module

;[Global]
; default-profile =                                  #name of the profile
; use-dolby-hw-loopback= yes | no                    #Enable dsp loopbck for dolby, if this flag is enabled then iec61937 capture will be disabled

; [Port name]
; description = ...
; direction = in | out
; priority = ...
; presence = static | dynamic | always                                     #static means port is always available but device
                                                                           #connection is not known.
                                                                           #dynamic mean port presence is detected at dynamically.
                                                                           #always means port and device both are always present.

# Below port params are only used for loopback as only in loopback uses these params configurable
; device = qahw device
; encodings =                                                              #list of encodings
; sample-rates =                                                           #list of supported sample rates
; sample-formats =                                                         #list of sample formats
; channel-maps =                                                           #list of channel maps
; format-detection = yes | no                                              #yes if format detection is supported by a port
; port-type = primary | secondary                                          #describes whether the port is primary or secondary
; linked-ports =                                                           #name of linked ports if any
; primary-port-name =                                                      #name of the primary port it is linked to
; linkon0-node-path = ...                                                  #sys node path to linkon0 attribute
; poweron-node-path = ...                                                  #sys node path to poweron attribute
; audio-path-node-path = ...                                               #sys node path to audio path attribute
; arc-enable-node-path = ...                                               #sys node path to arc enable attribute
; state-node-path = ...                                                    #sys node path to audio state attribute
; sample-format-node-path = ...                                            #sys node path to audio format attribute
; sample-rate-node-path = ...                                              #sys node path to audio rate attribute
; sample-layout-node-path = ...                                            #sys node path to audio layout attribute
; sample-channel-node-path = ...                                           #sys node path to audio channel attribute
; sample-ch-alloc-node-path = ...                                          #sys node path to audio channel allocation attribute
; arc-state-node-path                                                      #sys node path to arc audio state attribute
; arc-sample-format-node-path                                              #sys node path to arc audio format attirbute
; arc-sample-rate-node-path                                                #sys node path to arc audio rate attribute

; [Profile name]
; description = ...
; priority = ...
; max-sink-channels =
; max-source-channels =
; port-names =                                                             #list of port names in this profile
                                                                           #for port effect,list of port for which its supported

;[Sink name]
; name =
; description =
; type = offload | low-latency | ultra-low-latency | primary
; flags = AUDIO_OUTPUT_FLAG_FAST | AUDIO_OUTPUT_FLAG_RAW | AUDIO_OUTPUT_FLAG_DIRECT_PCM | AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD | AUDIO_OUTPUT_FLAG_NON_BLOCKING | AUDIO_OUTPUT_FLAG_PRIMARY
; default-sample-format =                                                  #default sample format
; default-sample-rate =                                                    #default sample rate
; default-channel-map =                                                    #default channel map
; encodings =                                                              #list of encodings
; sample-rates =                                                           #list of supported sample rates
; sample-formats =                                                         #list of sample formats
; channel-maps =                                                           #list of channel maps
; format-detection = yes | no                                              # yes if format detection is supported by a port
; presence = static | dynamic                                              #static sinks are created at module load and dynamic sink are created based on event
; port-names =                                                             #list of support ports for this sink, first entry is will be considered as default port
; use-hw-volume = true | false                                             #true for if dsp volume needs to applied
; alternate-sample-rate =                                                  #alternate sample to be supported
; avoid-processing =                                                       #list of configurations that PA should avoid processing (all, rate, bitwidth, channels, true)

;[Source name]
; name =
; description =
; type = low-latecy or regular or iec61937
; flags = AUDIO_INPUT_FLAG_NONE | AUDIO_INPUT_FLAG_FAST | QAHW_INPUT_FLAG_TIMESTAMP | QAHW_INPUT_FLAG_COMPRESS
; default-sample-format =                                                  #default sample format
; default-sample-rate =                                                    #default sample rate
; default-channel-map =                                                    #default channel map
; encodings =                                                              #list of encodings
; sample-rates =                                                           #list of supported sample rates
; sample-formats =                                                         #list of sample formats
; channel-maps =                                                           #list of channel maps
; format-detection = yes | no                                              #yes if format detection is supported by a port
; presence = static | dynamic                                              #static sinks are created at module load and dynamic sink are created based on event
; port-names =                                                             #list of support ports for this sink, first entry is will                                                                                                         #be considered as default port
; alternate-sample-rate =                                                  #alternate sample to be supported
; source-type = AUDIO_SOURCE_MIC | AUDIO_SOURCE_UNPROCESSED
; buffer-duration =                                                        #buffer duration in ms
; avoid-processing =                                                       #list of configurations that PA should avoid processing (all, rate, bitwidth, channels)


;[Loopback name]
; description =
; in-port-names =                                                           #list of supported source ports, first entry is will be considered as default port
; out-port-names =                                                          #list of supported sink ports, first entry is will be considered as default port

;[Effect name]
;description =
;lib-name =                                                                 #effect library name
;uuid =                                                                     #effect uuid
;endpoint-names =                                                           #list of all endpoints an effect is supported on

[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 100
presence = static
device = AUDIO_DEVICE_OUT_SPEAKER

[Port headset]
description = headset
direction = out
priority = 500
presence = dynamic
device = AUDIO_DEVICE_OUT_WIRED_HEADSET

[Port headphone]
description = headphone
direction = out
priority = 300
presence = dynamic
device = AUDIO_DEVICE_OUT_WIRED_HEADPHONE

[Port lineout]
description = lineout
direction = out
priority = 200
presence = static
device = AUDIO_DEVICE_OUT_LINE

[Port headset-mic]
description = headset-mic
direction = in
priority = 500
presence = dynamic
device = AUDIO_DEVICE_IN_WIRED_HEADSET

[Port builtin-mic]
description = builtin-mic
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Port hdmi-in]
description = hdmi-in
direction = in
priority = 50
presence = dynamic
device = AUDIO_DEVICE_IN_HDMI

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 8
max-source-channels = 2
port-names = speaker lineout headset headphone headset-mic builtin-mic hdmi-in

[Sink offload0]
description = qahw sink to play pcm/compressed music data via offload path
type = offload
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT
default-encoding = pcm
default-sample-rate = 48000
default-channel-map = front-left,front-right
encodings = pcm mpeg aac
port-names = speaker lineout headset headphone
presence = always
use-hw-volume = true
alternate-sample-rate = 44100

[Sink low-latency0]
description = qahw sink to play pcm via low-latency path
type = low-latency
flags = AUDIO_OUTPUT_FLAG_FAST
default-encoding = pcm
default-sample-rate = 48000
default-channel-map = front-left,front-right
port-names = speaker lineout headset headphone
presence = always
use-hw-volume = false

[Sink ultra-low-latency0]
description = qahw sink to play pcm via ultra-low-latency path
type = ultra-low-latency
flags = AUDIO_OUTPUT_FLAG_RAW
default-encoding = pcm
default-sample-rate = 48000
default-channel-map = front-left,front-right
port-names = speaker lineout headset headphone
presence = always
use-hw-volume = false

[Source low-latency0]
description = qahw source to capture pcm via low-latency path
type = low-latency
flags = AUDIO_INPUT_FLAG_FAST
default-encoding = pcm
default-sample-rate = 48000
default-channel-map = front-left,front-right
port-names = headset-mic builtin-mic hdmi-in
presence = always

[Source regular0]
description = qahw source to capture pcm via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
default-encoding = pcm
default-sample-rate = 48000
default-channel-map = front-left,front-right
port-names = headset-mic builtin-mic hdmi-in
presence = always

