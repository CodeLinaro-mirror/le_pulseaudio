[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port lineout]
description = lineout
direction = out
priority = 200
presence = always
device = AUDIO_DEVICE_OUT_LINE

[Port linein]
description = linein input
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_LINE

[Port spdif-in]
description = spdif input
direction = in
priority = 300
presence = static
device = AUDIO_DEVICE_IN_SPDIF

[Port builtin-mic]
description = builtin mic
direction = in
priority = 100
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 12
max-source-channels = 2
port-names = lineout builtin-mic spdif-in

[Sink offload0]
description = qahw sink to play pcm via offload path
type = pcm-offload
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT
encoding = pcm
port-names = lineout
presence = always
use-hw-volume = true
alternate-sample-rate = 44100

[Sink low-latency0]
description = qahw sink to play pcm via low-latency path
type = low-latency
flags = AUDIO_OUTPUT_FLAG_FAST
encoding = pcm
port-names = lineout
presence = always
use-hw-volume = false

[Sink ultra-low-latency0]
description = qahw sink to play pcm via ultra-low-latency path
type = ultra-low-latency
flags = AUDIO_OUTPUT_FLAG_RAW
encoding = pcm
port-names = lineout
presence = dynamic
use-hw-volume = false

[Source regular0]
description = qahw source to capture pcm via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
encoding = pcm
port-names = builtin-mic linein
presence = always

[Source regular1]
description = qahw source to capture pcm with source spdif via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
encoding = pcm
sample-rates = 48000
port-names = spdif-in
presence = dynamic

[Source iec61937]
description = qahw source to capture iec61937 with source spdif via passthrough capture path
type = passthrough
flags = QAHW_INPUT_FLAG_PASSTHROUGH QAHW_INPUT_FLAG_COMPRESS
encoding = unknown-iec61937 unknown-4x-iec61937 unknown-hbr-iec61937
sample-rates = 48000
port-names = spdif-in
presence = dynamic
