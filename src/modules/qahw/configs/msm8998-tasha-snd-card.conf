[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 100
presence = static
device = AUDIO_DEVICE_OUT_SPEAKER

[Port headset]
description = headset
direction = out
priority = 500
presence = dynamic
device = AUDIO_DEVICE_OUT_WIRED_HEADSET

[Port headphone]
description = headphone
direction = out
priority = 300
presence = dynamic
device = AUDIO_DEVICE_OUT_WIRED_HEADPHONE

[Port lineout]
description = lineout
direction = out
priority = 200
presence = static
device = AUDIO_DEVICE_OUT_LINE

[Port headset-mic]
description = headset-mic
direction = in
priority = 500
presence = dynamic
device = AUDIO_DEVICE_IN_WIRED_HEADSET

[Port builtin-mic]
description = builtin-mic
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Port hdmi-in]
description = hdmi-in
direction = in
priority = 50
presence = dynamic
device = AUDIO_DEVICE_IN_HDMI

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 8
max-source-channels = 2
port-names = speaker lineout headset headphone headset-mic builtin-mic hdmi-in

[Sink offload0]
description = qahw sink to play pcm via offload path
type = pcm-offload
flags = AUDIO_OUTPUT_FLAG_COMPRESS_OFFLOAD AUDIO_OUTPUT_FLAG_NON_BLOCKING AUDIO_OUTPUT_FLAG_DIRECT
encoding = pcm
;sample-rates = 48000
;sample-formats = s16le
;default-channel-map = front-left,front-right
port-names = speaker lineout headset headphone
presence = always

[Sink low-latency0]
description = qahw sink to play pcm via low-latency path
type = low-latency
flags = AUDIO_OUTPUT_FLAG_FAST
encoding = pcm
default-channel-map = front-left,front-right
port-names = speaker lineout headset headphone
presence = always

[Sink ultra-low-latency0]
description = qahw sink to play pcm via ultra-low-latency path
type = ultra-low-latency
flags = AUDIO_OUTPUT_FLAG_RAW
encoding = pcm
default-channel-map = front-left,front-right
port-names = speaker lineout headset headphone
presence = always

[Source low-latency0]
description = qahw source to capture pcm via low-latency path
type = low-latency
flags = AUDIO_INPUT_FLAG_FAST
encoding = pcm
default-channel-map = front-left,front-right
port-names = headset-mic builtin-mic hdmi-in
presence = always

[Source regular0]
description = qahw source to capture pcm via regular record path
type = regular
flags = AUDIO_INPUT_FLAG_NONE
encoding = pcm
default-channel-map = front-left,front-right
port-names = headset-mic builtin-mic hdmi-in
presence = always

