[Global]
default-profile = default
use-dolby-hw-loopback = no

[Port speaker]
description = speaker
direction = out
priority = 200
presence = always
device = AUDIO_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port lineout]
description = lineout
direction = out
priority = 100
presence = always
device = AUDIO_DEVICE_OUT_LINE
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port bta2dp-out]
description = bt a2dp output
direction = out
priority = 300
presence = dynamic
device = AUDIO_DEVICE_OUT_BLUETOOTH_A2DP
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port btsco-out]
description = bt sco output
direction = out
priority = 300
presence = dynamic
device = AUDIO_DEVICE_OUT_BLUETOOTH_SCO
encodings = pcm
sample-formats = s16le
sample-rates = 16000
channel-maps = front-left,front-right

[Port btsco-in]
description = bt sco input
direction = in
priority = 100
presence = dynamic
device = AUDIO_DEVICE_IN_BLUETOOTH_SCO_HEADSET
encodings = pcm
sample-formats = s16le
sample-rates = 16000
channel-maps = front-left,front-right

[Port linein]
description = linein input
direction = in
priority = 100
presence = static
device = AUDIO_DEVICE_IN_LINE
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right

[Port bta2dp-in]
description = bt a2dp input
direction = in
priority = 100
presence = dynamic
device = AUDIO_DEVICE_IN_BLUETOOTH_A2DP
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port spdif-in]
description = spdif input
direction = in
priority = 300
presence = static
device = AUDIO_DEVICE_IN_SPDIF
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes
state-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_state
