sample-format-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_format
sample-rate-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_rate
sample-layout-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_layout
sample-channel-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_ch_count
sample-ch-alloc-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/audio_ch_alloc

[Port builtin-mic]
description = builtin mic
direction = in
priority = 100
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC

[Port builtin-mic-ec-ref-loopback]
description = builtin mic and ec ref loopback
direction = in
priority = 10
presence = always
device = AUDIO_DEVICE_IN_BUILTIN_MIC_AND_EC_REF_LOOPBACK

[Profile default]
description = Default qahw profile
priority = 500
max-sink-channels = 12
max-source-channels = 10
port-names = speaker lineout bta2dp-out linein builtin-mic spdif-in bta2dp-in hdmi-in hdmi-arc builtin-mic-ec-ref-loopback btsco-in btsco-out

