sample-rate-node-path = /sys/devices/platform/soc/soc:qcom,msm-dai-q6-spdif-pri-tx/audio_rate

[Port hdmi-arc]
description = hdmi-arc
direction = in
priority = 50
presence = dynamic
device = AUDIO_DEVICE_IN_HDMI_ARC
encodings = pcm
sample-formats = s16le s24le
sample-rates = 48000
channel-maps = front-left,front-right
format-detection = yes
port-type = secondary
primary-port-name = hdmi-in
linkon0-node-path = /sys/devices/platform/soc/78b7000.i2c/i2c-3/3-0064/link_on0
