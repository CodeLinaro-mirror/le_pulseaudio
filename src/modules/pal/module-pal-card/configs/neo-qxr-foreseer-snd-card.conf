[Global]
default-profile = default

[Port speaker]
description = speaker
default-channel-map = front-left,front-right
default-sample-rate = 48000
direction = out
priority = 200
presence = always
device = PAL_DEVICE_OUT_SPEAKER
encodings = pcm
sample-formats = s16le
sample-rates = 48000
channel-maps = front-left,front-right

[Port handset-mic]
description = builtin mic
default-channel-map = front-center
default-sample-rate = 48000
direction = in
priority = 50
presence = always
device = PAL_DEVICE_IN_HANDSET_MIC

[Profile default]
description = Default pal profile
priority = 500
max-sink-channels = 2
max-source-channels = 2
port-names = speaker handset-mic

[Sink low-latency0]
description = pal sink to play via low-latency path
type = PAL_STREAM_LOW_LATENCY
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1024
default-buffer-count = 4
port-names = speaker
presence = always
use-hw-volume = true

[Source regular0]
description = pal source to capture pcm via FNN record path
pal-devicepp-config = dual-mic-fnn
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always

[Source regular1]
description = pal source to capture pcm via FFECNS record path
pal-devicepp-config = dual-mic-ffecns
type = PAL_STREAM_DEEP_BUFFER
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always

[Source regular2]
description = pal source to capture pcm via RAW record path
pal-devicepp-config = dual-mic-raw
type = PAL_STREAM_RAW
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always

[Source regular4]
description = pal source to capture pcm via RAW record path and ec-ref
pal-devicepp-config = quad-mic-ec-ref
type = PAL_STREAM_RAW
default-encoding = pcm
default-sample-rate = 48000
default-sample-format = s16le
default-channel-map = front-left,front-right,side-left,side-right,front-center
default-buffer-size = 1920
default-buffer-count = 2
port-names = handset-mic
presence = always
